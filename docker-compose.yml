# Local/demo stack: PostgreSQL, web app, queue worker. Optional profiles: `s3` (MinIO) and `clamav`.
#   docker compose up --build            # then open http://localhost:3000  (seeded demo data: `docker compose run --rm web npm run db:seed`)
#   docker compose --profile s3 up       # S3-compatible object storage (set STORAGE_DRIVER=s3)
# WARNING: DEMO_MODE=true enables the local role-simulation login (anyone can sign in as anyone). Never expose this stack.
x-app-env: &app-env
  DATABASE_URL: postgresql://followme:followme@db:5432/followme
  APP_BASE_URL: http://localhost:3000
  SESSION_SECRET: ${SESSION_SECRET:-change-me-change-me-change-me-change-me}
  ASSET_ENCRYPTION_KEY: ${ASSET_ENCRYPTION_KEY:-ZGV2LW9ubHkta2V5LWRldi1vbmx5LWtleS0xMjM0NTY=}
  STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
  STORAGE_LOCAL_DIR: /data/storage
  S3_ENDPOINT: http://minio:9000
  S3_BUCKET: followme
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
  AUTH_MODE: local
  DEMO_MODE: "true"
  AI_PROVIDER: ${AI_PROVIDER:-local}
  AI_API_KEY: ${AI_API_KEY:-}
  MALWARE_SCANNER: ${MALWARE_SCANNER:-builtin}
  CLAMAV_HOST: ${CLAMAV_HOST:-}
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: followme, POSTGRES_PASSWORD: followme, POSTGRES_DB: followme }
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U followme"], interval: 5s, timeout: 3s, retries: 20 }
  web:
    build: .
    environment: { <<: *app-env, JOBS_INLINE: "false" }
    ports: ["3000:3000"]
    depends_on: { db: { condition: service_healthy } }
    volumes: [storage:/data/storage]
  worker:
    build: .
    command: ["npm", "run", "worker"]
    environment: { <<: *app-env, JOBS_INLINE: "false" }
    depends_on: { db: { condition: service_healthy }, web: { condition: service_started } }
    volumes: [storage:/data/storage]
  minio:
    profiles: [s3]
    image: minio/minio
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin }
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
  clamav:
    profiles: [clamav]
    image: clamav/clamav:stable
    ports: ["3310:3310"]
volumes: { dbdata: {}, storage: {}, miniodata: {} }
