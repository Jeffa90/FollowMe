openapi: 3.1.0
info:
  title: FollowMe API
  version: 0.1.0
  description: |
    Work-instruction lifecycle platform API. Every operation is authorised server-side (role, organisation, site and classification).
    Cookie-session requests that change state require the X-CSRF-Token header (double-submit). Browser-extension requests use scoped bearer tokens.
    This file is GENERATED by scripts/gen-openapi.ts from the route files and verified by tests/openapi.test.ts.
servers:
  - url: http://localhost:3000
components:
  securitySchemes:
    cookieAuth: { type: apiKey, in: cookie, name: fm_session }
    csrfToken: { type: apiKey, in: header, name: X-CSRF-Token }
    bearerToken: { type: http, scheme: bearer, description: 'Scoped API token (fmt_...), e.g. scope capture' }
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties: { code: { type: string }, message: { type: string }, requestId: { type: string }, details: {} }
  responses:
    Unauthorized: { description: Authentication required, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Forbidden: { description: Not permitted (role, segregation of duties, CSRF), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotFound: { description: Not found or not visible to the caller (cross-organisation objects are indistinguishable from missing ones), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Invalid: { description: Validation failed or business rule violated, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Conflict: { description: State conflict (e.g. immutable version, stale rev), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    TooMany: { description: Rate limited, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
